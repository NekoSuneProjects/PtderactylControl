services:
  pterocontrol:
    build: .
    image: pterocontrol:latest
    container_name: pterocontrol
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8787
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
