name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PteroControl-Windows
          - os: [self-hosted, Linux, docker, buildx]
            artifact: PteroControl-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - if: runner.os == 'Windows'
        run: npm run desktop:dist
      - if: runner.os == 'Windows'
        run: npm run desktop:portable
      - if: runner.os == 'Linux'
        run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
